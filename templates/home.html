<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{

            background: linear-gradient(135deg,#4facfe,#00f2fe);

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:40px;
        }

        .card{

            width:700px;

            border:none;

            border-radius:20px;

            box-shadow:0px 10px 30px rgba(0,0,0,.25);

            padding:30px;

        }

        h1{

            text-align:center;

            font-weight:bold;

            margin-bottom:30px;

        }

        .btn{

            width:100%;

            height:50px;

            font-size:18px;

            font-weight:bold;

        }

        .result{

            margin-top:25px;

            background:#d1e7dd;

            padding:20px;

            border-radius:12px;

            text-align:center;

            font-size:22px;

            font-weight:bold;

        }

    </style>

</head>

<body>

<div class="card">

<h1>🎓 Student Performance Predictor</h1>

<form action="{{ url_for('predict_datapoint') }}" method="post">

<div class="mb-3">
    <label class="form-label">Gender</label>
    <select class="form-select" name="gender" required>
        <option selected disabled>Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>
</div>

<div class="mb-3">
    <label class="form-label">Race / Ethnicity</label>
    <select class="form-select" name="ethnicity" required>
        <option selected disabled>Select Group</option>
        <option value="group A">Group A</option>
        <option value="group B">Group B</option>
        <option value="group C">Group C</option>
        <option value="group D">Group D</option>
        <option value="group E">Group E</option>
    </select>
</div>

<div class="mb-3">
    <label class="form-label">Parental Education</label>
    <select class="form-select" name="parental_level_of_education" required>
        <option selected disabled>Select Education</option>
        <option value="associate's degree">Associate's Degree</option>
        <option value="bachelor's degree">Bachelor's Degree</option>
        <option value="high school">High School</option>
        <option value="master's degree">Master's Degree</option>
        <option value="some college">Some College</option>
        <option value="some high school">Some High School</option>
    </select>
</div>

<div class="mb-3">
    <label class="form-label">Lunch</label>
    <select class="form-select" name="lunch" required>
        <option selected disabled>Select Lunch Type</option>
        <option value="standard">Standard</option>
        <option value="free/reduced">Free / Reduced</option>
    </select>
</div>

<div class="mb-3">
    <label class="form-label">Test Preparation</label>
    <select class="form-select" name="test_preparation_course" required>
        <option selected disabled>Select</option>
        <option value="none">None</option>
        <option value="completed">Completed</option>
    </select>
</div>

<div class="mb-3">
    <label class="form-label">Reading Score</label>
    <input class="form-control" type="number" name="reading_score" min="0" max="100" required>
</div>

<div class="mb-3">
    <label class="form-label">Writing Score</label>
    <input class="form-control" type="number" name="writing_score" min="0" max="100" required>
</div>

<div class="d-grid">
    <button class="btn btn-primary btn-lg">
        Predict Math Score 🚀
    </button>


</form>

{% if results %}

<div class="result">

🎯 Predicted Maths Score

<br><br>

{{results}}

</div>

{% endif %}

</div>

</body>

</html>

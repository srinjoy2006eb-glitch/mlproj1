<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;

            background:linear-gradient(135deg,#4facfe,#00f2fe);

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{

            width:700px;

            padding:50px;

            text-align:center;

            border:none;

            border-radius:25px;

            background:white;

            box-shadow:0px 15px 40px rgba(0,0,0,.25);

            transition:.3s;

        }

        .card:hover{

            transform:translateY(-8px);

        }

        h1{

            font-size:45px;

            font-weight:bold;

            color:#0d6efd;

        }

        p{

            color:#555;

            font-size:20px;

            margin-top:20px;

        }

        .btn{

            margin-top:35px;

            width:280px;

            height:60px;

            font-size:22px;

            border-radius:50px;

            transition:.3s;

        }

        .btn:hover{

            transform:scale(1.08);

        }

        footer{

            margin-top:35px;

            color:gray;

        }

    </style>

</head>

<body>

<div class="card">

<h1>🎓 Student Performance Predictor</h1>

<p>

Predict students' Mathematics score using Machine Learning.

</p>

<p>

Built with <b>Python • Flask • Scikit-learn</b>

</p>

<a href="/predictdata">

<button class="btn btn-primary">

🚀 Start Prediction

</button>
